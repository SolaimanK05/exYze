[project]
name = "exyze-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.160,<0.170",
    "psycopg[binary,pool]>=3,<4",
    "pydantic>=2,<3",
]

[dependency-groups]
dev = ["fastapi-cli>=0.0.34,<0.1", "httpx2>=2,<3", "pytest>=9,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
