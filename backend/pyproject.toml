[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ezdxf>=1.4.5",
    "fastapi>=0.160,<0.170",
    "psycopg[binary,pool]>=3,<4",
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "fastapi-cli>=0.0.34,<0.1",
    "httpx2>=2,<3",
    "pytest>=9.2.0,<10",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["geometry/tests", "tests"]
